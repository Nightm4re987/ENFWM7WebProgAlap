<!DOCTYPE html>
<html lang="hu">
<head>

    <title>video</title>

    <style>


.grid {
    display: grid;
    grid-template-columns: 1fr 2.5fr;
    grid-template-rows: 1fr 1fr 1fr;
}
   
   footer {
        border-top: 4px solid gray;
        padding-top: 2rem;
        margin-top: 2rem;
        width: 37.5rem;
        text-align: right;
   }
   
   
   </style>
</head>
<body>

    <header>

    <section>

        <div class="grid">

                <button id="start">indítás</button>
                <button id="stop">leállítás</button>
            </div>
        <div>
                    <button id="startstop">indítás/leállítás</button>
        </div>
            <div>

        </div>
        <div>

            <button id="veryfast">nagyongyors</button>

        </div>
        <div>

            <button id="small">kicsi</button>
            <button id="normalsize">normál</button>

        </div>
        <div>

        </div>
    </section>


    <footer>
        forrás: <a href=" https://www.w3schools.com/html/html5_video.asp"> https://www.w3schools.com/html/html5_video.asp</a>
        </footer>

        <script>

            let btnclick = (id, onclick) => document.getElementById
            (id).addeventlistener("click", onclick);

            const video = document.querySelector("video");

            btnclick("start", () => video.play());

            btnclick("stop", () => video.pause ());
            btnclick("startstop", () => video.paused ? video.play ());

            btnclick("loud", () => video.volume ());
            btnclick("", () => video.playbackRate = 0.5 ());    
            btnclick("loud", () => video.volume = 0 ());
            btnclick("loud", () => video.volume = 0.5 ());

            btnclick("veryslow", () => playbackRate = 1 ());
                btnclick("slow", () => playbackRate = 1 ());
                    btnclick("normal", () => playbackRate = 1 ());

        </script>



</body>
</html>
