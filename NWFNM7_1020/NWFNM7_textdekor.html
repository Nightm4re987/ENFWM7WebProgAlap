<!DOCTYPE html>
<html lang="en">
 <head>

    <title>Text-decoration tulajdonság</title>
    <meta charset="UTF-8">

    <style>
        body {background-color: #0e9873;}

        #para1 {
            text-align: left;
            color: rgb(255,, 0, 13);
            font-size: 20pt;
        }

        a {text-decoration: none; }

        .decorated {

            text-decoration: underline dotted rgb(251, 255, 0);

        }

    </style>
</head>

     <body>

        <h1>CSS - text-decoration</h1>

        <p id="para1"><a href="https://www.unithe.hu" target="_blank">kattints ide a 
            <i>unithe.hu</i>weblap megnyitásához!</a></p>

             <p id="para1" class="fecorated">Egy sárga pontozott vonallal aláhúzott
                szöveg </p>


     </body>
 </html>
