<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>do while ciklus</title>
</head>
<body>
    
    <h2>do While ciklus</h2>

    <p id="neptunkod"></p>


    <script>

        let kiir = "";
        let i=1;

        do  {
            kiir += "A ciklus változó értéke: " + i + "<br>";
            i++}
            while (i <= 10)
            
             document.getElementById("neptunkod").innerHTML = kiir;

    </script>
</body>
</html>
