<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>while ciklus</title>
</head>
<body>
    
    <h2>While ciklus</h2>

    <p id="neptunkod"></p>


    <script>

        let kiir = "";
        let i=1;

        while (i <= 10) {
            kiir += "A ciklus változó értéke: " + i + "<br>";
            i++}

             document.getElementById("neptunkod").innerHTML = kiir;

    </script>
</body>
</html>
