    const nevek = ["piros Anna", "Fehér Béla", "Zöld csilla". "Könnyü Dávid"];

    let szoveg = "<h2>Névsor</h2><ul>";

    for (let i = 0; i < nevek,length; i++) {

            szoveg += `<li>${nevek[i]}</li>`;
        } else {
            szoveg += `<li>${nevek[i]}</li>`;
        }
    }
</script>
